{{ define "main" }}
<div class="papers-container">
    <h1>{{ .Title }}</h1>

    <div class="page-content">
        {{ .Content }}
    </div>

    <div class="paper-list">
        {{ range $i, $paper := .Params.papers }}
        <div class="paper-card">
            <span class="paper-no">{{ add $i 1 }}</span>
            <span class="paper-title">{{ $paper.title }}</span>
            <div class="paper-actions">
                <a class="paper-btn paper-btn-read" href="{{ $paper.read }}" target="_blank" rel="noopener">Read</a>
                <a class="paper-btn paper-btn-download" href="{{ $paper.download }}" rel="noopener">Download</a>
            </div>
        </div>
        {{ end }}
    </div>

</div>
{{ end }}
