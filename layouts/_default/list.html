{{ define "main" }}
<section class="list-page">
  <header class="page-header">
    {{ if not .Params.hideTitle }}
      <h1>{{ .Title }}</h1>
    {{ end }}
  </header>
  
  {{ with .Content }}
    <div class="page-intro">{{ . }}</div>
  {{ end }}
  <div class="card-grid">
    {{ range .Pages.ByWeight }}
      <a class="card" href="{{ .RelPermalink }}">
        {{ $image := .Params.image | default .Params.cover | default (index .Params.images 0) }}
        {{ if $image }}
          <div class="card-image">
            <img src="{{ $image | relURL }}" alt="{{ .Title }}" />
          </div>
        {{ end }}
        <h3>{{ .Title }}</h3>
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
