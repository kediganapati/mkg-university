<div class="social-share">
  <h3>Share Knowledge for Social Responsibility</h3>

  <div class="social-share-buttons">

    <!-- Facebook -->
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn facebook" aria-label="Share on Facebook">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
    </a>

    <!-- X / Twitter -->
    <a href="https://twitter.com/intent/tweet?text={{ .Title | urlquery }}&url={{ .Permalink | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn twitter" aria-label="Share on X">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-6.9l-5.4-6.6L4.8 22H1.7l8.1-9.3L1 2h7l4.9 6L18.9 2Zm-1.2 18h1.9L7.4 4h-2l12.3 16Z"/></svg>
    </a>

    <!-- WhatsApp -->
    <a href="https://wa.me/?text={{ .Title | urlquery }}%20{{ .Permalink | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn whatsapp" aria-label="Share on WhatsApp">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2Zm5.8 14.3c-.2.7-1.4 1.4-2 1.5-.5.1-1.1.1-1.8-.1-.4-.1-1-.3-1.6-.6-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.8-2.1 1.1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1.2-.2.8-.9 1-1.2.2-.3.4-.2.7-.1.3.1 1.7.8 2 1 .3.1.5.2.6.3.1.2.1.9-.1 1.6Z"/></svg>
    </a>

    <!-- LinkedIn -->
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn linkedin" aria-label="Share on LinkedIn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5V9h3v10ZM6.5 7.7A1.7 1.7 0 1 1 6.5 4.3a1.7 1.7 0 0 1 0 3.4ZM19 19h-3v-5.3c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V19h-3V9h2.9v1.4h.1c.4-.8 1.4-1.7 3-1.7 3.2 0 3.8 2.1 3.8 4.8V19Z"/></svg>
    </a>

    <!-- Email -->
    <a href="mailto:?subject={{ .Title | urlquery }}&body={{ .Permalink | urlquery }}"
       class="share-btn email" aria-label="Share by Email">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4-8 5-8-5V6l8 5 8-5v2Z"/></svg>
    </a>

    <!-- Copy Link -->
    <button type="button" class="share-btn copy-link" aria-label="Copy article link"
      onclick="navigator.clipboard.writeText('{{ .Permalink }}').then(() => { this.querySelector('.copy-label').textContent = 'Copied!'; setTimeout(() => this.querySelector('.copy-label').textContent = '', 1500); })">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1Zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm0 16H8V7h11v14Z"/></svg>
      <span class="copy-label" style="font-size:0.65rem; display:block;"></span>
    </button>

        <!-- Pinterest -->
    <a href="https://pinterest.com/pin/create/button/?url={{ .Permalink | urlquery }}&description={{ .Title | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn pinterest" aria-label="Share on Pinterest">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12c0 4.2 2.6 7.8 6.3 9.3-.1-.8-.2-2 0-2.9.2-.8 1.3-5.6 1.3-5.6s-.3-.7-.3-1.6c0-1.5.9-2.7 2-2.7.9 0 1.4.7 1.4 1.6 0 1-.6 2.4-1 3.7-.3 1.1.5 2 1.6 2 1.9 0 3.2-2.4 3.2-5.3 0-2.2-1.5-3.8-4.2-3.8-3.1 0-5 2.3-5 4.8 0 .9.3 1.5.7 2 .2.2.2.3.1.6l-.2 1c-.1.3-.3.4-.6.2-1.5-.6-2.2-2.3-2.2-4.1 0-3 2.5-6.7 7.6-6.7 4.1 0 6.8 3 6.8 6.1 0 4.2-2.3 7.3-5.8 7.3-1.2 0-2.2-.6-2.6-1.4l-.7 2.8c-.3 1-.9 2.1-1.4 2.9 1 .3 2.1.5 3.2.5 5.5 0 10-4.5 10-10S17.5 2 12 2Z"/></svg>
    </a>

    <!-- Reddit -->
    <a href="https://www.reddit.com/submit?url={{ .Permalink | urlquery }}&title={{ .Title | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn reddit" aria-label="Share on Reddit">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M22 12c0-1.1-.9-2-2-2-.5 0-1 .2-1.3.5-1.3-.9-3.1-1.5-5.1-1.6l.9-4 2.8.6c0 .8.7 1.5 1.5 1.5.8 0 1.5-.7 1.5-1.5s-.7-1.5-1.5-1.5c-.6 0-1.1.3-1.3.8l-3.1-.7c-.2 0-.3 0-.4.2l-1 4.6c-2 .1-3.8.7-5.1 1.6-.3-.3-.8-.5-1.3-.5-1.1 0-2 .9-2 2 0 .8.5 1.5 1.1 1.8-.1.3-.1.6-.1.9 0 2.8 3.2 5 7.2 5s7.2-2.2 7.2-5c0-.3 0-.6-.1-.9.7-.3 1.1-1 1.1-1.8Zm-13.5 1.5c0-.8.7-1.5 1.5-1.5s1.5.7 1.5 1.5-.7 1.5-1.5 1.5-1.5-.7-1.5-1.5Zm7.1 3.4c-.9.9-2.6.9-2.6.9s-1.8 0-2.6-.9c-.1-.1-.1-.3 0-.5.1-.1.3-.1.5 0 .6.6 2 .6 2.1.6.1 0 1.6 0 2.1-.6.1-.1.3-.1.5 0 .1.2.1.4 0 .5Zm-.2-1.9c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.6 1.5-1.5 1.5Z"/></svg>
    </a>

    <!-- Telegram -->
    <a href="https://t.me/share/url?url={{ .Permalink | urlquery }}&text={{ .Title | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn telegram" aria-label="Share on Telegram">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M22 4 2 11.5l6 2.3 2.3 6.9 3.6-4.3 5 3.6L22 4ZM9.2 14.2 8 18l-.9-4.3 10.4-8.1-8.3 8.6Z"/></svg>
    </a>

    <!-- Tumblr -->
    <a href="https://www.tumblr.com/share/link?url={{ .Permalink | urlquery }}&name={{ .Title | urlquery }}"
       target="_blank" rel="noopener noreferrer"
       class="share-btn tumblr" aria-label="Share on Tumblr">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M15.5 21c-3.2 0-5.5-1.8-5.5-5.4V10H8V7.5c2.4-.6 3.4-2.6 3.5-4.5h2.6v4h3.4v3H14v5.1c0 1.4.7 1.9 1.8 1.9h1.6v3.2c-.5.2-1.4.7-1.9.7Z"/></svg>
    </a>

  </div>
</div>
