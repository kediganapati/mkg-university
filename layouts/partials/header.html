<header class="site-header">
  <div class="header-inner">

    <!-- ==============================
         MKG BRAND
         ============================== -->

    <a class="brand" href="{{ "/" | relLangURL }}">
      <span class="brand-text">
        <strong>MKG</strong> Digital University
        <small>of Sanatan Dharma</small>
      </span>
    </a>


    <!-- ==============================
         MAIN NAVIGATION
         ============================== -->

    <nav class="main-nav">
      <ul>

        {{ range .Site.Menus.main }}

        <li class="{{ if .HasChildren }}has-submenu{{ end }}">

          <a href="{{ .URL | relLangURL }}">
            {{ .Name }}
          </a>

          {{ if .HasChildren }}

          <ul class="submenu">

            {{ range .Children }}

            <li>
              <a href="{{ .URL | relLangURL }}">
                {{ .Name }}
              </a>
            </li>

            {{ end }}

          </ul>

          {{ end }}

        </li>

        {{ end }}

      </ul>
    </nav>


    <!-- ==============================
         MKG LANGUAGE SWITCHER
         ============================== -->

    <div class="mkg-language" id="mkgLanguage">

      <button
        type="button"
        class="language-toggle"
        id="languageToggle"
        aria-expanded="false"
        aria-controls="languageMenu"
        translate="no"
      >
        <span>🌐</span>
        <span>Language</span>
        <span class="language-arrow">▾</span>
      </button>


      <!-- Language Dropdown -->

      <div
        class="language-menu"
        id="languageMenu"
        translate="no"
      >

        <div class="language-menu-title">
          Select Language
        </div>


        <!-- Main Languages -->

        <button
          type="button"
          class="language-option active"
          data-lang="en"
          translate="no"
        >
          English
        </button>

        <button
          type="button"
          class="language-option"
          data-lang="hi"
          translate="no"
        >
          Hindi / हिन्दी
        </button>

        <button
          type="button"
          class="language-option"
          data-lang="zh-CN"
          translate="no"
        >
          Mandarin / 中文
        </button>

        <button
          type="button"
          class="language-option"
          data-lang="es"
          translate="no"
        >
          Spanish / Español
        </button>

        <button
          type="button"
          class="language-option"
          data-lang="fr"
          translate="no"
        >
          French / Français
        </button>

        <button
          type="button"
          class="language-option"
          data-lang="ar"
          translate="no"
        >
          Arabic / عربي
        </button>


        <!-- Divider -->

        <div class="language-divider"></div>


        <!-- More Languages -->

        <label
          class="language-more-label"
          for="moreLanguages"
          translate="no"
        >
          More Languages
        </label>

</header>


<!-- ==========================================
     HIDDEN GOOGLE TRANSLATE ENGINE
     ========================================== -->

<div
  id="mkg_gte_hidden"
  aria-hidden="true"
></div>


<script>
(function () {

  "use strict";


  /* ==========================================
     ELEMENTS
     ========================================== */

  var languageToggle =
    document.getElementById("languageToggle");

  var languageMenu =
    document.getElementById("languageMenu");

  var languageContainer =
    document.getElementById("mkgLanguage");

  var languageOptions =
    document.querySelectorAll(".language-option");

  var moreLanguages =
    document.getElementById("moreLanguages");


  if (
    !languageToggle ||
    !languageMenu ||
    !languageContainer
  ) {
    return;
  }


  /* ==========================================
     OPEN / CLOSE LANGUAGE MENU
     ========================================== */

  languageToggle.addEventListener(
    "click",
    function (event) {

      event.stopPropagation();

      var isOpen =
        languageContainer.classList.toggle("open");

      languageToggle.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
      );

    }
  );


  /* ==========================================
     CLOSE WHEN CLICKING OUTSIDE
     ========================================== */

  document.addEventListener(
    "click",
    function (event) {

      if (
        !languageContainer.contains(event.target)
      ) {

        languageContainer.classList.remove("open");

        languageToggle.setAttribute(
          "aria-expanded",
          "false"
        );

      }

    }
  );


  /* ==========================================
     GOOGLE TRANSLATION
     ========================================== */

  function doTranslate(code) {

    if (!code) {
      return;
    }


    /*
     * Google Translate creates this select
     * inside the hidden widget.
     */

    var googleSelect =
      document.querySelector(".goog-te-combo");


    if (googleSelect) {

      googleSelect.value = code;

      googleSelect.dispatchEvent(
        new Event("change")
      );

      return;
    }


    /*
     * Fallback if Google Translate
     * has not finished loading yet.
     */

    var googleValue =
      "/auto/" + code;


    document.cookie =
      "googtrans=" +
      googleValue +
      ";path=/";


    document.cookie =
      "googtrans=" +
      googleValue +
      ";path=/;domain=." +
      location.hostname;


    location.reload();

  }


  /* ==========================================
     MAIN LANGUAGE BUTTONS
     ========================================== */

  languageOptions.forEach(
    function (option) {

      option.addEventListener(
        "click",
        function () {

          var code =
            this.getAttribute("data-lang");


          /*
           * Active state
           */

          languageOptions.forEach(
            function (item) {

              item.classList.remove("active");

            }
          );


          this.classList.add("active");


          /*
           * Reset More Languages
           */

          if (moreLanguages) {
            moreLanguages.value = "";
          }


          /*
           * Translate
           */

          doTranslate(code);


          /*
           * Close menu
           */

          languageContainer.classList.remove(
            "open"
          );

          languageToggle.setAttribute(
            "aria-expanded",
            "false"
          );

        }
      );

    }
  );


  /* ==========================================
     MORE LANGUAGE SELECT
     ========================================== */

  if (moreLanguages) {

    moreLanguages.addEventListener(
      "change",
      function () {

        var code = this.value;


        if (!code) {
          return;
        }


        /*
         * Remove active state
         */

        languageOptions.forEach(
          function (item) {

            item.classList.remove("active");

          }
        );


        /*
         * Translate
         */

        doTranslate(code);


        /*
         * Close menu
         */

        languageContainer.classList.remove(
          "open"
        );

        languageToggle.setAttribute(
          "aria-expanded",
          "false"
        );

      }
    );

  }


  /* ==========================================
     GOOGLE TRANSLATE INITIALIZATION
     ========================================== */

  window.googleTranslateElementInit =
    function () {

      var hidden =
        document.getElementById(
          "mkg_gte_hidden"
        );


      if (!hidden) {
        return;
      }


      /*
       * Create Google Translate engine.
       */

      new google.translate.TranslateElement(
        {
          pageLanguage: "en",
          autoDisplay: false
        },
        "mkg_gte_hidden"
      );

    };


  /* ==========================================
     LOAD GOOGLE TRANSLATE SCRIPT
     ONLY ONCE
     ========================================== */

  if (
    !document.querySelector(
      'script[src*="translate.google.com/translate_a"]'
    )
  ) {

    var script =
      document.createElement("script");


    script.src =
      "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";


    script.async = true;


    document.head.appendChild(script);

  }


})();
</script>
